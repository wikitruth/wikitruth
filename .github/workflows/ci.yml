name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Migration Doc Drift
        run: npm run docs:drift

      - name: Test and Build Pipeline
        run: npm run test:ci

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-client
          path: coverage/client

      - name: Upload Migration Drift Report
        uses: actions/upload-artifact@v4
        with:
          name: migration-drift-report
          path: docs/frontend/MIGRATION_DRIFT_REPORT.md
